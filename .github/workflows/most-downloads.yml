name: Update most downloaded project

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/most-downloads.yml'
      - '.github/scripts/update_most_downloads.py'

permissions:
  contents: write

concurrency:
  group: profile-most-downloads
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Recalculate release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_most_downloads.py

      - name: Save a new winner
        run: |
          if git diff --quiet -- README.md; then
            echo 'Most Downloads already points to the top repository.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'Update the most downloaded project'
          git push
